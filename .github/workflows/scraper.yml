name: QOTW Scraper

on:
  schedule:
    # 8:00 AM PDT is 15:00 UTC. Runs every Monday (1)
    - cron: '0 15 * * 1'
  workflow_dispatch: # Allows manual triggering from the GitHub UI

# Give the workflow permission to push code back to the repository
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Cache Playwright Browser
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium
          
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install playwright pillow img2pdf
          
      - name: Install Playwright OS Dependencies
        run: playwright install-deps chromium
        
      - name: Download Playwright Chromium (if not cached)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium
          
      - name: Run Scraper
        run: |
          python qotw_scraper_headless.py
          
      - name: Commit and Push PDF to Repository
        if: success()
        run: |
          # Configure Git to act as the official GitHub Actions bot
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Add the newly generated PDF and commit it
          git add qotw/*.pdf
          git commit -m "Auto-captured QOTW PDF for $(date +'%Y-%m-%d')" || echo "No new PDFs to commit"
          
          # Push the PDF directly to the main branch
          git push
